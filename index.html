<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мой сайт 🚀</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;
            background: linear-gradient(135deg, #09001f, #19004d, #001b44);
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .hero {
            padding: 70px 20px 40px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #8c7cff;
        }

        .subtitle {
            font-size: 20px;
            color: #d5d5ff;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            margin: 8px;
            border-radius: 30px;
            background: #6c4cff;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.08);
            background: #8c73ff;
        }

        .card {
            margin-top: 30px;
            padding: 30px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        .card p {
            color: #ddddff;
            line-height: 1.6;
        }

        iframe {
            width: 100%;
            max-width: 700px;
            height: 390px;
            margin-top: 20px;
            border: none;
            border-radius: 18px;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 17px;
            }

            iframe {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <section class="hero">
            <h1>Привет! 👋</h1>

            <p class="subtitle">
                Добро пожаловать на мой первый сайт 🚀
            </p>

            <a class="button" href="#about">
                Узнать больше
            </a>

            <a class="button" href="#video">
                🎥 Видео
            </a>
        </section>


        <section class="card" id="about">

            <h2>О моём сайте 💻</h2>

            <p>
                Я создаю свой первый сайт с телефона
                и изучаю программирование.
            </p>

        </section>


        <section class="card" id="video">

            <h2>🎥 Моё видео</h2>

            <p>
                Здесь можно разместить видео с YouTube.
            </p>

            <iframe
                src="https://www.youtube.com/embed/YbGsc1eHK1E"
            </iframe>

        </section>


        <footer>
            © 2026 Мой первый сайт
        </footer>

    </div>

</body>
</html>
